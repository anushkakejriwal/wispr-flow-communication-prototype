  .hint b { color: #cbb6ff; font-weight: 800; }

<body>
<div class="page">
  <div class="concept">Product concept, not affiliated with Wispr AI. Illustrative sample content.</div>
  <div class="pagetitle">Communication coaching for Flow</div>
  <p class="sub">A concept for a coaching feature inside Flow: a daily recap of how you communicate, tuned to your role.</p>
  <div class="phone" id="phone">
    <div class="screen" id="screen"></div>
    <div class="hint" id="hint"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div>
<script>
var view = 'setup';
var role = 'manager';
var recapScroll = 0;

var everyday = [
  { n: `Cutting filler words`, s: `About <b>1 every 40 words</b>`, w: `Mostly when answering questions on the spot` },
  { n: `Speaking without hedging`, s: `Used "just," "maybe," or "sort of" about <b>30 times</b>`, w: `Most often when disagreeing` },
  { n: `Letting others finish`, s: `Started talking before someone finished <b>6 times</b>`, w: `Mostly in bigger meetings, less in 1:1s` },
  { n: `Keeping sentences short`, s: `About <b>1 in 5</b> sentences ran past 40 words`, w: `Mostly in spoken updates, rarely in writing` },
  { n: `Asking open-ended questions`, s: `Asked <b>7</b> open-ended questions this week`, w: `Most often in 1:1s` }
];

var roles = {
  ic: {
    label: `Individual contributor`,
    ava: '\u{1F469}‍\u{1F4BB}',
    topics: [`The billing platform re-architecture design review`, `The identity platform dependency for the SSO rollout`, `The LatAm subscriptions expansion moving to December`],
    worked: [
      { t: `You backed up your concerns with actual data.`,
        ex: [
          { q: `I'm worried this design could double-charge customers. In testing, about 3 in every 1,000 invoices came out duplicated. We average 200K invoices a month, so that's roughly 600 customers billed twice. We need to fix that before we commit to this design.`, w: `11:24 AM, billing re-architecture design review` },
          { q: `I'm concerned the SSO rollout won't be ready for our Q1 renewals. For context, 12 of them have SSO in the contract, which is around $1.8M in ARR. If the identity work isn't done by end of January, some of those renewals are at risk.`, w: `3:10 PM, email to the team` }
        ],
        why: `Backing each concern with data made the stakes clear, so people skipped the debate and went straight to fixing it.` },
      { t: `You sized the work and laid out the trade-offs.`,
        ex: [
          { q: `Localizing checkout for Brazil and Mexico is about three weeks of work, which pushes the LatAm launch to December. If we launch in Mexico first, we can still hit November and add Brazil in January.`, w: `1:40 PM, LatAm planning meeting` },
          { q: `Fixing the duplicate invoices properly is about two weeks of work, which would push the billing cutover past the end of the quarter. If we add a check that blocks duplicates before they go out, we can keep the date and do the full fix in January.`, w: `4:15 PM, 1:1 with your manager` }
        ],
        why: `Each time you flagged a delay, you also brought a way to keep things moving, so the conversation went to picking a path instead of dwelling on the slip.` }
    ],
    better: [
      { t: `When someone pushed back, you let your point go.`,
        ex: [
          { q: `Yeah, no, that's fair. It's probably an edge case, we can just keep an eye on it.`, w: `11:31 AM, design review, after pushback on the duplicates` },
          { q: `Okay, sure. Let's try to get both countries in by November and see how it goes.`, w: `1:52 PM, LatAm planning meeting, after pushback on launching Mexico first` }
        ],
        why: `You'd already made a strong case, and agreeing that quickly made it sound like it wasn't that important after all, so the decision moved ahead without it.`,
        tries: [
          { l: `Design review`, a: `Put the issue in context, then offer a fix`, line: `I hear you that it's a small share of invoices. But 600 customers a month is still XX in revenue, so it's worth handling. Can we add a step to the design that catches duplicates before invoices go out? I can share a first version by Thursday.` },
          { l: `LatAm planning meeting`, a: `Restate the trade-off, then offer a way to decide`, line: `I get wanting both in November. Localizing both countries is about three weeks of work, which is what pushes us to December. Could we look at Mexico in November and Brazil in January? I'll put both timelines side by side so we can decide together.` }
        ] },
      { t: `Your updates took a while to get to the point.`,
        ex: [
          { q: `So on SSO, I've been going through the identity team's docs, and I set up a test environment, and I started mapping out how login would work for the enterprise accounts, and I think the main thing is I'm blocked until they send over the API spec.`, w: `9:30 AM, standup` },
          { q: `Hey! I've been going through the LatAm expansion material and a few things came up with localization, and I talked to a couple of people, and I think we might need to talk about the timeline, it's looking like it could slip to December.`, w: `2:40 PM, Slack to your manager` }
        ],
        why: `The most important part was said towards the end, where it was easiest to miss.`,
        tries: [
          { l: `Standup`, a: `Lead with the blocker, then the background`, line: `I'm blocked on SSO until the identity team sends over the API spec. In the meantime, I've set up a test environment and started mapping out the enterprise login flow.` },
          { l: `Slack to your manager`, a: `Lead with the news, then explain`, line: `Heads up, the LatAm expansion could slip to December. A few things came up with localization that I want to walk you through. Do you have 15 minutes today?` }
        ] }
    ],
    compare: [
      { good: true, k: `Backing up concerns with data`, v: `3 times this week, up from 1 last week` },
      { good: false, k: `Letting a point go after pushback`, v: `4 times this week, up from 3 last week` }
    ],
    themesTitle: `Individual contributor themes`,
    themes: [
      { n: `Making your case with data`, s: `Backed up <b>3 of 5</b> concerns with data`, w: `Strongest in email and design reviews` },
      { n: `Explaining trade-offs`, s: `Laid out options in <b>2 of 4</b> delays you flagged`, w: `Mostly in planning meetings` },
      { n: `Standing by your view`, s: `Held your view in <b>2 of 6</b> disagreements`, w: `Strongest in writing, weakest in larger meetings` },
      { n: `Getting to the point`, s: `Led with the main point in <b>3 of 9</b> updates`, w: `Updates in standup tended to bury it` },
      { n: `Raising risks early`, s: `Flagged <b>2 risks</b> before they became blockers`, w: `Both in writing, none out loud` }
    ],
    focus: { t: `Standing by your view`, tip: `Next time someone pushes back in a meeting, say what it would take to change your mind before you agree.` }
  },
  manager: {
    label: `People manager`,
    ava: '\u{1F468}‍\u{1F4BC}',
    topics: [`The on-call rotation changes for the infra team`, `Your 1:1 with Jordan about missed deadlines`, `Q1 hiring plan for the platform team`],
    worked: [
      { t: `You made sure everyone left the conversation with next steps and a clear sense of what they owned.`,
        ex: [
          { q: `Okay, so to wrap up: Nina owns the new rotation schedule and sends it out by Wednesday. Theo updates the runbooks by Friday. I'll sort out the escalation path with the SRE team by next Tuesday.`, w: `10:45 AM, on-call planning meeting` },
          { q: `Before we drop off, let's confirm next steps. I'll write up the two backend role descriptions by Monday, and Nina will line up the interview panel.`, w: `3:40 PM, hiring plan meeting` }
        ],
        why: `Everyone left knowing exactly what they owned and by when, so nothing got dropped between meetings and there were clear next steps.` },
      { t: `You explained the reasoning behind your decisions.`,
        ex: [
          { q: `We're moving to a one-week on-call rotation instead of two. Last month, three people on two-week shifts got paged after midnight more than twelve times, and that's not sustainable.`, w: `9:15 AM, team standup` },
          { q: `I'm prioritizing two backend hires over a frontend hire this quarter. Most of our Q1 roadmap is API work, and we're already stretched on that side.`, w: `2:10 PM, email to the direct-reports group` }
        ],
        why: `Giving the reason upfront made the decisions easier to understand, and gave anyone who disagreed something specific to respond to.` }
    ],
    better: [
      { t: `You softened feedback until the point got lost.`,
        ex: [
          { q: `So, um, the last couple of deadlines slipped a bit, which honestly happens to everyone, and I know you've had a lot on your plate, so no big deal, just something to maybe keep in mind.`, w: `11:30 AM, 1:1 with Jordan` },
          { q: `This is looking great, thank you! Just a small thing, and totally fine if not, but maybe the weekend coverage could possibly use another look at some point?`, w: `4:00 PM, email to Nina` }
        ],
        why: `With that much cushioning around it, the feedback could be taken as optional.`,
        tries: [
          { l: `1:1 with Jordan`, a: `Be honest about it, then figure it out together`, line: `I want to talk about the last couple of deadlines that slipped. I know you've had a lot on your plate, and I really want to understand what's been getting in the way and how I can help, so we can get the next one in on time.` },
          { l: `Email to Nina`, a: `Thank her for the work, then be clear about the change`, line: `This is looking great, thank you for pulling it together. One thing to flag before it goes out Wednesday: the weekend coverage needs another look. Happy to go through it with you if that helps.` }
        ] },
      { t: `You answered your own questions before anyone else could.`,
        ex: [
          { q: `What do you think made the last couple of deadlines tough to hit? I'm guessing it was mostly the scope, right?`, w: `11:45 AM, 1:1 with Jordan` },
          { q: `Any thoughts on whether we hire senior or mid-level? Honestly, I'd lean senior, we need people who can ramp fast, so maybe senior it is.`, w: `3:15 PM, hiring plan meeting` }
        ],
        why: `You asked for input, then gave the answer in the same breath, so people never got a real chance to weigh in.`,
        tries: [
          { l: `1:1 with Jordan`, a: `Ask, then let them answer`, line: `What do you think made the last couple of deadlines tough to hit? I'd really like to understand your perspective.` },
          { l: `Hiring meeting`, a: `Share your lean, then open it up`, line: `I'd lean senior since we need people who can ramp fast, but I want to hear if anyone has thoughts on that approach before we decide.` }
        ] }
    ],
    compare: [
      { good: true, k: `Ending meetings with clear next steps and owners`, v: `4 times this week, up from 2 last week` },
      { good: false, k: `Answering your own questions`, v: `5 times this week, up from 3 last week` }
    ],
    themesTitle: `People manager themes`,
    themes: [
      { n: `Making ownership clear`, s: `Ended <b>4 of 6</b> meetings with clear next steps and owners`, w: `Mostly in planning meetings` },
      { n: `Explaining your decisions`, s: `Gave the reasoning behind <b>3 of 4</b> decisions you shared`, w: `Strongest in emails to the team` },
      { n: `Giving honest, caring feedback`, s: `Was clear about the issue in <b>1 of 4</b> pieces of feedback`, w: `Softest in 1:1s` },
      { n: `Making room for others`, s: `Let people answer in <b>3 of 8</b> questions you asked`, w: `Happened in both 1:1s and team meetings` },
      { n: `Recognizing good work`, s: `Called out specific wins <b>5 times</b>`, w: `Mostly in email, rarely in team meetings` }
    ],
    focus: { t: `Making room for others`, tip: `Next time you ask the team a question, wait for at least one answer before you share your own view.` }
  },
  founder: {
    label: `Founder`,
    ava: '\u{1F680}',
    topics: [`The all-hands on the new product direction`, `Your Series C planning meeting`, `The enterprise plan pricing change`],
    worked: [
      { t: `You led with the decision, then explained it.`,
        ex: [
          { q: `We're pausing work on the mobile app for the next quarter so we can focus on the integrations customers keep asking for. I'll walk you through why, and what it means for each team.`, w: `9:05 AM, all-hands` },
          { q: `We're raising $50M, mostly to build out our sales team in Europe. Let me walk you through why now.`, w: `11:02 AM, Series C planning meeting` }
        ],
        why: `People heard the decision first, so they could actually listen to the reasoning instead of waiting to hear the answer.` },
      { t: `You were straight about the numbers, including the ones that weren't good.`,
        ex: [
          { q: `Our burn is running about $400K a month higher than we planned. That's going to come up, so I want us to have a talking point ready to answer to that.`, w: `11:10 AM, Series C planning meeting` },
          { q: `Lowlight summary: we hit 92% of our Q3 revenue target. The shortfall came from two large deals slipping into Q4, and both are now in contracting.`, w: `4:30 PM, investor update email` }
        ],
        why: `Sharing the weak numbers yourself, before anyone had to ask, made everything else you said easier to trust and showed you weren't hiding anything.` }
    ],
    better: [
      { t: `You kept talking after you'd already answered.`,
        ex: [
          { q: `Because our Europe pipeline doubled this year and we need the team there now. And honestly the market's good right now, and there's some competitor stuff going on, and we'd probably want to hire faster anyway, which is a whole separate conversation.`, w: `11:25 AM, Series C planning meeting, when asked why raise now` },
          { q: `The new price reflects what you're getting. And look, if it's a problem, we can probably work something out, maybe a discount for the first year, or we could look at a smaller plan.`, w: `2:30 PM, customer call, when asked why the price is going up` }
        ],
        why: `Your first answer was strong. Everything you added after it made it sound less certain, and on the customer call it opened the door to a discount before anyone asked for it.`,
        tries: [
          { l: `Planning meeting`, a: `Give the answer, then stop`, line: `Because our Europe pipeline doubled this year and we need the team there now. Happy to go into the other reasons if that's useful.` },
          { l: `Customer call`, a: `Give the reasons, then stop`, line: `We've added XX since you signed on, and the new price reflects that. Our own costs have also gone up, mostly XX. Happy to walk through any of it with you.` }
        ] },
      { t: `You used insider language with people who might not know it.`,
        ex: [
          { q: `So basically we're a vertical AI workflow layer on top of the system of record, and we're post-PMF in two of our ICPs.`, w: `10:30 AM, call with a VP of Engineering candidate` },
          { q: `We're seeing really strong pull in mid-market, our NRR is best-in-class, and the flywheel's really starting to spin.`, w: `5:15 PM, podcast interview` }
        ],
        why: `Terms like ICP and NRR are second nature to you, but the people you were talking to aren't inside your company, so the point got harder to follow.`,
        tries: [
          { l: `Candidate call`, a: `Describe it the way they would`, line: `We build software that takes a lot of the manual work off XX teams. We've found two kinds of customers who really love it, and we're doubling down on them.` },
          { l: `Podcast`, a: `Explain it like you would to a friend`, line: `More mid-sized companies are finding us on their own, and once customers start using us, they tend to use us more over time.` }
        ] }
    ],
    compare: [
      { good: true, k: `Leading with the decision`, v: `4 times this week, up from 2 last week` },
      { good: false, k: `Insider language with outside audiences`, v: `3 times this week, up from 1 last week` }
    ],
    themesTitle: `Founder themes`,
    themes: [
      { n: `Leading with the decision`, s: `Opened with the decision in <b>4 of 5</b> big announcements`, w: `Strongest in the all-hands and planning meetings` },
      { n: `Being upfront about setbacks`, s: `Raised <b>2 of 3</b> tough numbers before anyone asked`, w: `Mostly in investor and planning conversations` },
      { n: `Answering with confidence`, s: `Let your first answer stand in <b>2 of 6</b> tough questions`, w: `Strongest in prepared conversations, weaker when put on the spot` },
      { n: `Speaking plainly`, s: `Used plain language in <b>2 of 5</b> conversations outside the company`, w: `Insider terms came up most on external calls` },
      { n: `Setting a clear direction`, s: `Shared where the company is headed <b>3 times</b>`, w: `Most clearly in the all-hands` }
    ],
    focus: { t: `Answering with confidence`, tip: `When a question catches you off guard, give one clear answer, then ask "Does that answer it?" instead of adding more.` }
  }
};

var ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.4 12 4l8 7.4"/><path d="M6 10.2V20h12v-9.8"/></svg>',
  brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.2a3 3 0 0 0-3 3 2.4 2.4 0 0 0-1.1 4.4A2.5 2.5 0 0 0 9 17a3 3 0 0 0 3 1.8 3 3 0 0 0 3-1.8 2.5 2.5 0 0 0 1.1-4.4A2.4 2.4 0 0 0 15 8.2a3 3 0 0 0-3-3Z"/><path d="M12 5.2v13.6"/></svg>',
  scissors: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="2.3"/><circle cx="6.5" cy="17.5" r="2.3"/><path d="M8.6 7.9 20 17"/><path d="M8.6 16.1 20 7"/></svg>',
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6.5h7V8"/><path d="M7.5 6.8V17"/><path d="M13 11.5V10.5h7v1"/><path d="M16.5 10.8V17"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/><path d="M10 12.5h5M10 15.5h5"/></svg>'
};

function statusbar() {
  return '<div class="sb"><span class="t">3:03</span><span class="island"></span><span class="sys">'
  + '<svg width="19" height="13" viewBox="0 0 19 13"><rect x="0" y="9" width="3" height="4" rx="1" fill="#211F28"/><rect x="5" y="6" width="3" height="7" rx="1" fill="#211F28"/><rect x="10" y="3" width="3" height="10" rx="1" fill="#211F28"/><rect x="15" y="1" width="3" height="12" rx="1" fill="#c4c2cc"/></svg>'
  + '<svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="#211F28" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.3C5.6 1 12.4 1 16.5 4.3"/><path d="M4 7C6.9 4.7 11.1 4.7 14 7"/><path d="M6.6 9.7C8 8.6 10 8.6 11.4 9.7"/><circle cx="9" cy="11.6" r=".6" fill="#211F28" stroke="none"/></svg>'
  + '<svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3.2" fill="none" stroke="#211F28" stroke-opacity=".4"/><rect x="3" y="3" width="9" height="7" rx="1.6" fill="#E3B100"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#211F28" fill-opacity=".4"/></svg>'
  + '</span></div>';
}
var WORDMARK = '<div class="wordmark"><span class="wave"><i style="height:7px"></i><i style="height:14px"></i><i style="height:10px"></i><i style="height:16px"></i></span>Flow</div>';
function appbarMain(on) { return '<div class="appbar"><div class="hb"><span></span><span></span><span></span></div>' + WORDMARK + '<span class="sw ' + (on ? 'on' : 'off') + '"></span></div>'; }
function appbarSub() { return '<div class="appbar"><span class="back" data-go="recap">&#8249;</span>' + WORDMARK + '<span class="xclose" data-go="recap">&times;</span></div>'; }
function tabsHtml() {
  return [['Home', 'home'], ['Dictionary', 'brain'], ['Snippets', 'scissors'], ['Style', 'type'], ['Scratchpad', 'note']].map(function(it) {
    return '<div class="tab' + (it[0] === 'Home' ? ' active' : '') + '" data-tab="1"><span class="picon">' + ICON[it[1]] + '</span>' + it[0] + '</div>';
  }).join('');
}
function chip(r) { return '<div class="chip" data-go="setup"><span class="av">' + r.ava + '</span><span class="cl">Coaching for <b>' + r.label + '</b></span><span class="cg">Change</span></div>'; }
function q(s) { return '“' + s + '”'; }

function setupBody() {
  var opt = function(key) {
    return '<div class="opt' + (role === key ? ' sel' : '') + '" data-selrole="' + key + '"><span class="radio"></span><span class="name">' + roles[key].label + '</span></div>';
  };
  return '<div class="content" style="padding-top:22px"><div class="kicker" style="text-align:center">Set up coaching</div>'
  + '<h2 class="ph" style="text-align:center">What’s your <em>role?</em></h2>'
  + '<p class="lead" style="text-align:center;margin:10px 10px 20px">Flow coaches you based on your role.</p>'
  + opt('ic') + opt('manager') + opt('founder')
  + '<p class="footnote" style="margin:4px 6px 16px">Not sure? Pick the closest. Your role sets the starting point, the coaching works from what you actually say.</p>'
  + '<div class="btn" data-go="recap">See my recap</div></div>';
}

function patternHtml(p, kind) {
  var exCls = kind === 'w' ? 'g' : 'p';
  var html = '<div class="pat"><div class="pt">' + p.t + '</div>';
  html += p.ex.map(function(e) { return '<div class="ex ' + exCls + '"><p>' + q(e.q) + '</p><span class="ts">' + e.w + '</span></div>'; }).join('');
  html += '<p class="why"><b>' + (kind === 'w' ? 'Why it worked:' : 'Why it could be better:') + '</b> ' + p.why + '</p>';
  if (kind === 'b') {
    html += '<div class="try"><span class="tl">Try something like</span>'
      + p.tries.map(function(t) { return '<div class="ti"><div class="tlab">' + t.l + ' <span>(' + t.a + ')</span></div><p>' + q(t.line) + '</p></div>'; }).join('')
      + '</div>';
  }
  return html + '</div>';
}

function recapBody() {
  var r = roles[role];
  return '<div class="content">'
  + '<div class="kicker">Daily recap</div><h2 class="ph">How you communicated <em>today</em></h2><div class="date">Friday, Nov 6</div>'
  + chip(r)
  + '<div class="card"><span class="pill">Summary</span><div class="csub">Today’s topics</div>' + r.topics.map(function(t) { return '<div class="r">' + t + '</div>'; }).join('') + '</div>'
  + '<div class="card"><span class="pill green">What worked</span>' + r.worked.map(function(p) { return patternHtml(p, 'w'); }).join('') + '</div>'
  + '<div class="card"><span class="pill purple">What could be better</span>' + r.better.map(function(p) { return patternHtml(p, 'b'); }).join('') + '</div>'
  + '<div class="card"><span class="pill">Compared to last week</span><div class="csub">Your patterns this week</div>'
  + r.compare.map(function(c) { return '<div class="tr2"><span class="ar ' + (c.good ? 'good' : 'bad') + '">' + (c.good ? '&#8593;' : '&#8595;') + '</span><span><b>' + c.k + ':</b> ' + c.v + '</span></div>'; }).join('') + '</div>'
  + '<div class="card"><span class="pill">Coming soon</span><div class="csub">Tap a topic to dive deeper</div>' + r.topics.map(function(t) { return '<div class="r dim">' + t + '</div>'; }).join('') + '</div>'
  + '<div class="cream"><div class="ch">Recap your week</div><p>See your weekly communication recap, with the themes and trends in how you communicated.</p><div class="btn" data-go="weekly">See my weekly recap</div></div>'
  + '<p class="footnote">Only you can see this recap. You can turn Coaching off in Settings.</p></div>';
}

function rowsHtml(list) {
  return list.map(function(x) { return '<div class="wrow"><div class="wn">' + x.n + '</div><div class="ws">' + x.s + '</div><div class="ww">' + x.w + '</div></div>'; }).join('');
}

function weeklyBody() {
  var r = roles[role];
  return '<div class="content">'
  + '<div class="kicker">Weekly recap</div><h2 class="ph">How you communicated <em>this week</em></h2><div class="date">Nov 2 to Nov 6</div>'
  + chip(r)
  + '<div class="card"><span class="pill purple">Your role</span><div class="csub">' + r.themesTitle + '</div>' + rowsHtml(r.themes) + '</div>'
  + '<div class="card"><span class="pill">Everyday</span><div class="csub">Everyday communication</div>' + rowsHtml(everyday) + '</div>'
  + '<div class="cream"><span class="pill">Focus for next week</span><div class="ch">' + r.focus.t + '</div><p class="last">' + r.focus.tip + '</p></div>'
  + '<p class="footnote">Only you can see this recap. You can turn Coaching off in Settings.</p></div>';
}

function render() {
  var screen = document.getElementById('screen');
  var hint = document.getElementById('hint');
  document.getElementById('tabbar').innerHTML = tabsHtml();
  var bar, body;
  if (view === 'setup') { bar = appbarMain(false); body = setupBody(); hint.innerHTML = 'Pick a role, then tap <b>See my recap</b>. You can switch roles here.'; }
  else if (view === 'recap') { bar = appbarMain(true); body = recapBody(); hint.innerHTML = 'Read the daily recap, then tap <b>See my weekly recap</b> at the bottom. You can switch roles by tapping <b>Change</b> at the top.'; }
  else { bar = appbarSub(); body = weeklyBody(); hint.innerHTML = 'This is your weekly recap. Tap the <b>X</b> at the top to go back to your daily recap.'; }
  screen.innerHTML = statusbar() + bar + body;
  screen.scrollTop = (view === 'recap') ? recapScroll : 0;
}

document.getElementById('phone').addEventListener('click', function(e) {
  if (view === 'recap') recapScroll = document.getElementById('screen').scrollTop;
  var sel = e.target.closest('[data-selrole]');
  if (sel) { role = sel.getAttribute('data-selrole'); render(); return; }
  var go = e.target.closest('[data-go]');
  if (go) {
    var dest = go.getAttribute('data-go');
    if (dest === 'setup' || (dest === 'recap' && view === 'setup')) recapScroll = 0;
    view = dest; render(); return;
  }
  if (e.target.closest('[data-tab]')) { recapScroll = 0; view = 'recap'; render(); }
});
render();
</script>
</body>
</html>
